# Theme Settings
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/

# theme                  : "minimal-mistakes-jekyll"
# remote_theme           : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "catppuccin_mocha" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

# Site Settings
locale                   : "en-US"
direction                : # "ltr" (default), "rtl" # set the direction of the page
#title                   : Defined in _config.dev.yml and _config.prod.yml
title_separator          : " | "
subtitle                 : "A long-form, text-first Bible study" # site tagline that appears below site title in masthead
name                     : "Bible By Example"
description              : "A long-form, text-first Bible study that teaches people how to read Scripture responsibly, without preaching, apologizing, or deconstructing."
#url                     : Defined in _config.dev.yml and _config.prod.yml; the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "Bible-By-Example/Bible-By-Example-Web"
teaser                   : "/assets/res/Logo.Main.png" # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : "/assets/res/Logo.Book.64w.png" # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : false # true, false (default)
words_per_minute         : 200
enable_copy_code_button  : # true, false (default)
copyright                : # "copyright" name, defaults to site.title
copyright_url            : # "copyright" URL, defaults to site.url

comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
  disqus:
    shortname            : # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    # https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
  utterances:
    theme                : # "github-light" (default), "github-dark"
    issue_term           : # "pathname" (default)
  giscus:
    repo_id              : # Shown during giscus setup at https://giscus.app
    category_name        : # Full text name of the category
    category_id          : # Shown during giscus setup at https://giscus.app
    discussion_term      : # "pathname" (default), "url", "title", "og:title"
    reactions_enabled    : # '1' for enabled (default), '0' for disabled
    theme                : # "light" (default), "dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"
    strict               : # 1 for enabled, 0 for disabled (default)
    input_position       : # "top", "bottom" # The comment input box will be placed above or below the comments
    emit_metadata        : # 1 for enabled, 0 for disabled (default) # https://github.com/giscus/giscus/blob/main/ADVANCED-USAGE.md#imetadatamessage
    lang                 : # "en" (default)
    lazy                 : # true, false # Loading of the comments will be deferred until the user scrolls near the comments container.
  staticman:
    branch               : # "master"
    endpoint             : # "https://{your Staticman v3 API}/v3/entry/github/"

reCaptcha:
  siteKey                :
  secret                 :

# Generate Atom feeds - https://github.com/jekyll/jekyll-feed
feed:
  path                   : "/rss-posts.xml" # blank (default) uses feed.xml
  posts_limit            : 15
# Minimal Mistakes has some similar settings, but only used by the theme logic - not the plugin.
atom_feed:
  path                   : "/rss-posts.xml" # blank (default) uses feed.xml
  hide                   : # true, false (default)

search                   : # true, false (default)
search_full_content      : # true, false (default)
search_provider          : # lunr (default), algolia, google
lunr:
  search_within_pages    : # true, false (default)
algolia:
  application_id         : # YOUR_APPLICATION_ID
  index_name             : # YOUR_INDEX_NAME
  search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  powered_by             : # true (default), false
google:
  search_engine_id       : # YOUR_SEARCH_ENGINE_ID
  instant_search         : # false (default), true

# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
  card                   : # The site's default card type

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 : "/assets/res/Logo.Main.png" # Open Graph/Twitter default site image
og_image_alt             : "Bible By Example" # Alt text for Open Graph/Twitter default site image

# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Organization # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles

# Analytics
analytics:
  provider               : # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          :
    anonymize_ip         : # true, false (default)


# Site Author
author:
  name                   : "Mark Bussell Jr. (AnonJr)"
  avatar                 : # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio                    : "A fellow traveler in this study."
  location               : "Coastal NC, USA"
  email                  :
  # fediverse              : "@you@instance.social"  # used for fediverse:creator meta tag

  links:
    - label              : "Email"
      icon               : "fas fa-fw fa-square-envelope"
      # url                : "mailto:your.name@email.com"
    - label              : "Website"
      icon               : "fas fa-fw fa-link"
      url                : "https://www.anonjr.com"
    - label              : "Instagram"
      icon               : "fa-brands fa-instagram"
      url                : "https://www.instagram.com/anonjr_live/"
    - label              : "Reddit"
      icon               : "fa-brands fa-reddit"
      url                : "https://www.reddit.com/user/AnonJr/"
    - label              : "Substack"
      icon               : "fa-solid fa-bookmark"
      url                : "https://substack.com/@anonjr"
    - label              : "X / Twitter"
      icon               : "fa-brands fa-square-x-twitter"
      url                : "https://x.com/AnonJr/"

# Site Footer
footer:
  links:
    - label              : "Twitter"
      icon               : "fab fa-fw fa-square-x-twitter"
      # url                :
      # rel                : "me"  # optional: adds rel attribute (e.g. for IndieWeb web sign-in)
    - label              : "Facebook"
      icon               : "fab fa-fw fa-square-facebook"
      # url                :
    - label              : "GitHub"
      icon               : "fab fa-fw fa-github"
      url                : "https://github.com/Bible-By-Example/Bible-By-Example-Web/"
    - label              : "GitLab"
      icon               : "fab fa-fw fa-gitlab"
      # url                :
    - label              : "Bitbucket"
      icon               : "fab fa-fw fa-bitbucket"
      # url                :
    - label              : "Instagram"
      icon               : "fab fa-fw fa-instagram"
      # url                :
  since                  : "2025"


# Reading Files
include:
  - .htaccess
#  - _pages - Don't put this here unless you want the directory to be processed twice
exclude:
  # Environment-specific configuration
  - _config.dev.yml
  - _config.prod.yml

  # Build caches
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache

  # Development tooling
  - .editorconfig
  - .gitattributes
  - .github/
  - .gitignore
  - .ruby-version
  - .scripts/
  - .vscode/
  - frontmatter.json

  # Build dependencies
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

  # Repository documentation
  - LICENSE.md
  - README.md

  # Deployment
  - wrangler.toml

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

show_drafts              : false
future                   : false

# Conversion
markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : <!--more-->
incremental              : false


# Markdown Processing - If GFM, https://kramdown.gettalong.org/quickref.html / https://github.com/kramdown/parser-gfm
kramdown:
  auto_ids               : true
  enable_coderay         : false
  entity_output          : as_char
  footnote_nr            : 1
  hard_wrap              : false
  input                  : GFM
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  toc_levels             : 1..6


# Sass/SCSS - https://github.com/jekyll/jekyll-sass-converter
sass:
  sass_dir               : _sass
  # style: compressed # Defined in _config.dev.yml and _config.prod.yml; https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  quiet_deps             : true
  silence_deprecations   : ['import']


# Outputting
permalink                : /articles/:year-:month-:day-:title.html # old - permalink: /:categories/:title/
date_format              : "%d %b %Y" # "%d %b %Y %H:%M" if I want to include time later
timezone                 : America/New_York # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Pagination with jekyll-paginate -  https://github.com/jekyll/jekyll-paginate
#paginate                 : 10 # amount of posts to show
#paginate_path            : /index/page:num/

# Pagination with jekyll-paginate-v2
# See https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration for configuration details
pagination:
  enabled                : false # Set enabled to true to use paginate v2
  debug                  : false
  collection             : 'posts'
  per_page               : 10
  permalink              : '/page/:num/'
  title                  : ':title - page :num'
  limit                  : 0
  sort_field             : 'date'
  sort_reverse           : true
  category               : 'posts'
  tag                    : ''
  locale                 : ''
  trail:
    before               : 2
    after                : 2


# Plugins (previously gems:)
plugins:
  - jekyll-seo-tag
  - jekyll-archives
  - jemoji
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-paginate


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
category_archive:
  type                   : jekyll-archives
  path                   : /category/
tag_archive:
  type                   : jekyll-archives
  path                   : /tag/
# show_taxonomy: false  # set to false to hide tag/category lists on posts
# https://github.com/jekyll/jekyll-archives
tag_archive_path         : "/tag/:name"
jekyll-archives:
  enabled:
    - tags
  layouts:
    tag                  : tagpage
  permalinks:
    tag                  : /tag/:name/


# HTML Compression https://jch.penibelst.de/
# Put `compress_html: false` in the frontmatter to disable on an individual page/post.
compress_html:
  blanklines             : true
  clippings              : all
  comments               : all
  ignore:
    envs                 : [development]
  profile                : false


# Collections
collections:
  episodes:
    output               : true
    permalink            : /:collection/:name:output_ext
  pages:
    output               : true
    permalink            : /:title:output_ext
  series:
    output               : true
    permalink            : /series/:slug/
  styleguide:            # Defined in _config.dev.yml and _config.prod.yml, keeping a sensible default just in case
    output               : false


# Defaults
defaults:
  # _episodes
  - scope:
      path               : "_episodes"
      type               : episodes
    values:
      layout             : episode
      author_profile     : false
      author             : Bible By Example
      read_time          : false
      comments           : false
      share              : true
      related            : false
  # _pages
  - scope:
      path               : "_pages"
      type               : pages
    values:
      layout             : pages
      author_profile     : false
      author             : Bible By Example
      read_time          : false
      comments           : false # true
      share              : false
      related            : false
  # _posts
  - scope:
      path               : "_posts"
      type               : posts
    values:
      layout             : single
      author_profile     : true
      author             : AnonJr
      read_time          : true
      show_date          : true
      comments           : # true
      share              : true
      show_taxonomy      : true
      related            : false
  # _series
  - scope:
      path               : "_series"
      type               : series
    values:
      layout             : pages
      author_profile     : false
      author             : Bible By Example
      read_time          : false
      comments           : false # true
      share              : true
      related            : false
